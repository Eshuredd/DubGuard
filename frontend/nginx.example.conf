# Reference configuration only. Not deployed. Terminate HTTPS at this server's
# TLS listener or a trusted reverse proxy; never expose reviewer tokens over HTTP.
server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 26m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "microphone=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_read_timeout 180s;
        proxy_request_buffering off;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
