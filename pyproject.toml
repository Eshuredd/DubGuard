[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dubguard"
version = "0.4.0"
description = "Text-first industrial narration review; never safety certification"
requires-python = ">=3.11"
dependencies = ["fastapi==0.128.2", "pydantic==2.11.7", "uvicorn==0.40.0", "httpx==0.28.1", "python-dotenv==1.2.4", "python-multipart==0.0.20"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "httpx==0.28.1"]

[project.scripts]
dubguard = "dubguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dubguard = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
